[package]
name = "crownos-updated"
description = "Checks, downloads and installs CrownOS releases with a rollback snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
crownos-ipc = { git = "https://github.com/crown-os/crownos-ipc", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
update-manifest = { workspace = true, features = ["fetch"] }
update-proto.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
update-client.workspace = true

[lints]
workspace = true
